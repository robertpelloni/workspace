<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Toolbox</title>
    <style>
        :root {
            --popup-bg: #FAF9F5;
            --popup-text: #3D3D3A;
            --popup-text-secondary: #6b6b68;
            --popup-border: rgba(0, 0, 0, 0.08);
            --popup-hover: rgba(0, 0, 0, 0.04);
            --popup-accent: #D97757;
            --popup-success: #16a34a;
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --popup-bg: #262624;
                --popup-text: #C2C0B6;
                --popup-text-secondary: #9a9894;
                --popup-border: rgba(255, 255, 255, 0.08);
                --popup-hover: rgba(255, 255, 255, 0.05);
                --popup-accent: #D97757;
                --popup-success: #22c55e;
            }
        }
        
        body {
            width: 350px;
            min-height: 400px;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--popup-bg);
            color: var(--popup-text);
        }
        
        .header {
            background: var(--popup-bg);
            padding: 20px;
            border-bottom: 1px solid var(--popup-border);
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--popup-text);
        }
        
        .logo {
            width: 24px;
            height: 24px;
            color: var(--popup-accent);
        }
        
        .content {
            padding: 16px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--popup-hover);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--popup-border);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--popup-accent);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--popup-text-secondary);
            text-transform: uppercase;
            margin-top: 4px;
        }
        
        .quick-actions {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--popup-text);
        }
        
        .action-button {
            width: 100%;
            padding: 12px;
            background: var(--popup-hover);
            border: 1px solid var(--popup-border);
            color: var(--popup-text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 8px;
            transition: all 150ms;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-button:hover {
            background: var(--popup-border);
            transform: translateY(-1px);
        }
        
        .action-button:active {
            transform: scale(0.98);
        }
        
        .action-icon {
            font-size: 18px;
        }
        
        .settings-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            color: var(--popup-text-secondary);
            text-decoration: none;
            font-size: 13px;
            border-top: 1px solid var(--popup-border);
            transition: color 150ms;
            background: var(--popup-bg);
        }
        
        .settings-link:hover {
            color: var(--popup-text);
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--popup-hover);
            border: 1px solid var(--popup-success);
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 16px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--popup-success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/>
                <rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/>
                <rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/>
                <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/>
            </svg>
            <span>Claude Toolbox</span>
        </h1>
    </div>
    
    <div class="content">
        <div class="status">
            <span class="status-dot"></span>
            <span>Active on claude.ai</span>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="chats-exported">0</div>
                <div class="stat-label">Chats</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="folders-created">0</div>
                <div class="stat-label">Folders</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="prompts-saved">0</div>
                <div class="stat-label">Prompts</div>
            </div>
        </div>
        
        <div class="quick-actions">
            <div class="section-title">Quick Actions</div>
            <button class="action-button" id="open-claude">
                <span class="action-icon">🚀</span>
                <span>Open Claude.ai</span>
            </button>
            <button class="action-button" id="export-all">
                <span class="action-icon">💾</span>
                <span>Export Current Chat</span>
            </button>
            <button class="action-button" id="manage-prompts">
                <span class="action-icon">📚</span>
                <span>Manage Prompt Library</span>
            </button>
        </div>
    </div>
    
    <a href="#" class="settings-link" id="open-settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6M5.636 5.636l4.243 4.243m4.242 4.242l4.243 4.243M1 12h6m6 0h6M5.636 18.364l4.243-4.243m4.242-4.242l4.243-4.243"/>
        </svg>
        <span>Extension Settings</span>
    </a>
    
    <script src="popup.js"></script>
</body>
</html>
