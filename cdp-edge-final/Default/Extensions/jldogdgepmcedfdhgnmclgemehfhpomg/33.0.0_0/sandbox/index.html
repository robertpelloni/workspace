<!-- pages/sandbox/index.html -->
<!DOCTYPE html>
<html>

<head>
    <script>
        // --- Conversion Utility To ToolOutput ---
        function toToolOutput(data) {
            if (data === null || data === undefined) {
                return [];
            }
            if (Array.isArray(data)) {
                return data.filter(item => item !== undefined && item !== null);
            }
            if (typeof data === 'object' || typeof data === 'string') {
                return [data];
            }
            return [String(data)];
        }

        // Override fetch to proxy through the main extension
        const originalFetch = window.fetch;
        window.__rtrvrCurrentExecutionContext = null;
        window.__rtrvrAvailableTools = [];

        // rtrvr.* namespace — same shape as webpage page-tool runtime so
        // generated code can be portable between sandbox and webpage modes.
        window.rtrvr = window.rtrvr || {};

        window.rtrvr.listTools = () => {
            try {
                return JSON.parse(JSON.stringify(window.__rtrvrAvailableTools || []));
            } catch (_) {
                return [];
            }
        };

        window.rtrvr.invokeBuiltin = (helperName, args = {}) => {
            return new Promise((resolve, reject) => {
                if (typeof helperName !== 'string' || !helperName) {
                    reject(new Error('rtrvr.invokeBuiltin requires a helper name'));
                    return;
                }
                if (!window.parent || window.parent === window) {
                    reject(new Error('Cannot call builtin helper: no parent window access'));
                    return;
                }
                const rpcId = crypto.randomUUID();
                const listener = (event) => {
                    if (event.source !== window.parent) return;
                    if (event.data?.type !== 'builtinHelperResult' || event.data?.rpcId !== rpcId) return;
                    window.removeEventListener('message', listener);
                    if (event.data.error) {
                        const err = new Error(event.data.error.message || `rtrvr.${helperName} failed`);
                        if (event.data.error.name) err.name = event.data.error.name;
                        reject(err);
                    } else {
                        resolve(event.data.result);
                    }
                };
                window.addEventListener('message', listener);
                try {
                    window.parent.postMessage({
                        type: 'builtinHelper',
                        rpcId,
                        helper: helperName,
                        args: args || {},
                        executionContext: window.__rtrvrCurrentExecutionContext || undefined,
                    }, '*');
                } catch (e) {
                    window.removeEventListener('message', listener);
                    reject(e);
                }
            });
        };

        window.rtrvr.createSheet = (args = {}) => window.rtrvr.invokeBuiltin('createSheet', args);
        window.rtrvr.appendRow = (args = {}) => window.rtrvr.invokeBuiltin('appendRow', args);
        window.rtrvr.appendColumn = (args = {}) => window.rtrvr.invokeBuiltin('appendColumn', args);
        window.rtrvr.readSheet = (args = {}) => window.rtrvr.invokeBuiltin('readSheet', args);
        window.rtrvr.getPageTree = (args = {}) => window.rtrvr.invokeBuiltin('getPageTree', args);
        window.rtrvr.pageAction = (args = {}) => window.rtrvr.invokeBuiltin('pageAction', args);
        window.rtrvr.listTabs = (args = {}) => window.rtrvr.invokeBuiltin('listTabs', args);
        window.rtrvr.createKB = (args = {}) => window.rtrvr.invokeBuiltin('createKB', args);
        window.rtrvr.listKB = (args = {}) => window.rtrvr.invokeBuiltin('listKB', args);
        window.rtrvr.queryKB = (args = {}) => window.rtrvr.invokeBuiltin('queryKB', args);
        window.rtrvr.addToKB = (args = {}) => window.rtrvr.invokeBuiltin('addToKB', args);
        window.rtrvr.createTool = (args = {}) => window.rtrvr.invokeBuiltin('createTool', args);
        window.rtrvr.customToolGenerator = (args = {}) => window.rtrvr.invokeBuiltin('customToolGenerator', args);
        window.rtrvr.listRecordings = (args = {}) => window.rtrvr.invokeBuiltin('listRecordings', args);
        window.rtrvr.startRecording = (args = {}) => window.rtrvr.invokeBuiltin('startRecording', args);
        window.rtrvr.finishRecording = (args = {}) => window.rtrvr.invokeBuiltin('finishRecording', args);
        window.rtrvr.act = (args = {}) => window.rtrvr.invokeBuiltin('act', args);
        window.rtrvr.extract = (args = {}) => window.rtrvr.invokeBuiltin('extract', args);
        window.rtrvr.processText = (args = {}) => window.rtrvr.invokeBuiltin('processText', args);

        function shouldRetryAsAsyncFunctionBody(error) {
            const name = error && error.name ? String(error.name) : '';
            const message = error && error.message ? String(error.message) : '';
            return name === 'SyntaxError' && (
                message.includes('await is only valid') ||
                message.includes('Illegal return statement') ||
                message.includes("Unexpected token 'return'")
            );
        }

        async function evaluateSandboxCode(code) {
            try {
                const result = eval(code);
                return (result instanceof Promise) ? await result : result;
            } catch (error) {
                if (!shouldRetryAsAsyncFunctionBody(error)) {
                    throw error;
                }
                const result = eval(`(async () => {\n${code}\n})()`);
                return (result instanceof Promise) ? await result : result;
            }
        }

        window.rtrvr.callTool = (toolName, parameters = {}) => {
            return new Promise((resolve, reject) => {
                if (typeof toolName !== 'string' || !toolName) {
                    reject(new Error('rtrvr.callTool requires a non-empty tool name'));
                    return;
                }
                if (!window.parent || window.parent === window) {
                    reject(new Error('Cannot call tool: no parent window access'));
                    return;
                }
                const rpcId = crypto.randomUUID();
                const listener = (event) => {
                    if (event.source !== window.parent) return;
                    if (event.data?.type !== 'callToolResult' || event.data?.rpcId !== rpcId) return;
                    window.removeEventListener('message', listener);
                    if (event.data.error) {
                        const err = new Error(event.data.error.message || 'callTool failed');
                        if (event.data.error.name) err.name = event.data.error.name;
                        reject(err);
                    } else {
                        resolve(event.data.result);
                    }
                };
                window.addEventListener('message', listener);
                try {
                    window.parent.postMessage({
                        type: 'callTool',
                        rpcId,
                        toolName,
                        parameters: parameters || {},
                        executionContext: window.__rtrvrCurrentExecutionContext || undefined,
                    }, '*');
                } catch (e) {
                    window.removeEventListener('message', listener);
                    reject(e);
                }
            });
        };
        window.fetch = (...args) => {
            return new Promise((resolve, reject) => {
                const fetchId = crypto.randomUUID();
                const toPlainHeaders = (headersLike) => {
                    try {
                        const out = {};
                        new Headers(headersLike || {}).forEach((value, key) => {
                            out[key] = value;
                        });
                        return out;
                    } catch (_) {
                        return headersLike;
                    }
                };

                const toSerializableArgs = (input, init) => {
                    const allowedInitKeys = [
                        'method',
                        'headers',
                        'body',
                        'credentials',
                        'mode',
                        'redirect',
                        'referrer',
                        'referrerPolicy',
                        'cache',
                        'integrity',
                        'keepalive',
                    ];
                    const toSerializableInit = (initLike) => {
                        if (!initLike || typeof initLike !== 'object') return undefined;
                        const nextInit = {};
                        for (const key of allowedInitKeys) {
                            if (initLike[key] !== undefined) {
                                nextInit[key] = initLike[key];
                            }
                        }
                        if (nextInit.headers) {
                            nextInit.headers = toPlainHeaders(nextInit.headers);
                        }
                        return nextInit;
                    };

                    let nextInput = input;
                    let nextInit = toSerializableInit(init);

                    if (typeof Request !== 'undefined' && input instanceof Request) {
                        nextInput = {
                            url: input.url,
                            method: input.method,
                            headers: toPlainHeaders(input.headers),
                            credentials: input.credentials,
                            mode: input.mode,
                            redirect: input.redirect,
                            referrer: input.referrer,
                            referrerPolicy: input.referrerPolicy,
                            cache: input.cache,
                            integrity: input.integrity,
                            keepalive: input.keepalive,
                        };
                    }

                    return [nextInput, nextInit];
                };
                const serializableArgs = toSerializableArgs(args[0], args[1]);

                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'fetch',
                        args: serializableArgs,
                        fetchId,
                        executionContext: window.__rtrvrCurrentExecutionContext || undefined
                    }, '*');
                } else {
                    reject(new Error("Cannot proxy fetch: No parent window access."));
                    return;
                }

                const fetchResponseListener = (event) => {
                    if (event.source === window.parent &&
                        event.data.type === 'fetchResponse' &&
                        event.data.fetchId === fetchId) {
                        window.removeEventListener('message', fetchResponseListener);
                        if (event.data.error) {
                            reject(new Error(event.data.error));
                        } else {
                            const payload = event.data.payload || {};
                            // Backward compatibility: older sender sent "response" as plain body string.
                            const body = payload.body !== undefined ? payload.body : (event.data.response || '');
                            const status = Number.isFinite(Number(payload.status)) ? Number(payload.status) : 200;
                            const statusText = typeof payload.statusText === 'string' ? payload.statusText : '';
                            const headers = payload.headers && typeof payload.headers === 'object' ? payload.headers : {};
                            const response = new Response(body, { status, statusText, headers });
                            try {
                                Object.defineProperty(response, '__rtrvrDebug', {
                                    value: {
                                        url: typeof payload.url === 'string' ? payload.url : undefined,
                                        requestedUrl: typeof payload.requestedUrl === 'string' ? payload.requestedUrl : undefined,
                                        status,
                                        statusText,
                                        retried: Boolean(payload.retried),
                                        transport: typeof payload.transport === 'string' ? payload.transport : undefined,
                                    },
                                    configurable: true,
                                });
                            } catch (_) {}
                            resolve(response);
                        }
                    }
                };
                window.addEventListener('message', fetchResponseListener);
            });
        };

        class ProxyXMLHttpRequest extends EventTarget {
            constructor() {
                super();
                this.readyState = 0;
                this.status = 0;
                this.statusText = '';
                this.responseType = '';
                this.response = null;
                this.responseText = '';
                this.responseURL = '';
                this.timeout = 0;
                this.withCredentials = false;
                this.onreadystatechange = null;
                this.onload = null;
                this.onerror = null;
                this.onloadend = null;
                this.onabort = null;
                this._headers = {};
                this._responseHeaders = {};
                this._method = 'GET';
                this._url = '';
                this._aborted = false;
            }

            open(method, url) {
                this._method = String(method || 'GET').toUpperCase();
                this._url = String(url || '');
                this._aborted = false;
                this.readyState = 1;
                this._emit('readystatechange');
            }

            setRequestHeader(name, value) {
                this._headers[String(name)] = String(value);
            }

            getResponseHeader(name) {
                const target = String(name || '').toLowerCase();
                for (const [key, value] of Object.entries(this._responseHeaders || {})) {
                    if (String(key).toLowerCase() === target) return value;
                }
                return null;
            }

            getAllResponseHeaders() {
                return Object.entries(this._responseHeaders || {})
                    .map(([key, value]) => `${key}: ${value}`)
                    .join('\r\n');
            }

            overrideMimeType() {}

            abort() {
                this._aborted = true;
                this._emit('abort');
                this._emit('loadend');
            }

            async send(body = null) {
                if (!this._url) {
                    this._fail(new Error('XHR send called before open'));
                    return;
                }

                const runFetch = async () => {
                    const response = await window.fetch(this._url, {
                        method: this._method,
                        headers: this._headers,
                        body,
                        credentials: this.withCredentials ? 'include' : 'same-origin',
                    });
                    const text = await response.text();
                    return { response, text };
                };

                try {
                    const { response, text } = await (this.timeout > 0
                        ? Promise.race([
                            runFetch(),
                            new Promise((_, reject) =>
                                setTimeout(() => reject(new Error('XHR timeout')), this.timeout),
                            ),
                        ])
                        : runFetch());

                    if (this._aborted) return;

                    this.status = Number(response.status) || 0;
                    this.statusText = response.statusText || '';
                    this.responseURL = response.url || this._url;
                    this._responseHeaders = {};
                    response.headers.forEach((value, key) => {
                        this._responseHeaders[key] = value;
                    });
                    this.readyState = 2;
                    this._emit('readystatechange');
                    this.readyState = 4;

                    if (this.responseType === 'json') {
                        try {
                            this.response = text ? JSON.parse(text) : null;
                        } catch (_) {
                            this.response = null;
                        }
                        this.responseText = text;
                    } else if (this.responseType === 'arraybuffer') {
                        this.response = new TextEncoder().encode(text).buffer;
                        this.responseText = '';
                    } else {
                        this.responseText = text;
                        this.response = text;
                    }

                    this._emit('readystatechange');
                    this._emit('load');
                    this._emit('loadend');
                } catch (error) {
                    if (this._aborted) return;
                    this._fail(error);
                }
            }

            _fail(error) {
                this.status = 0;
                this.statusText = error && error.message ? error.message : 'XHR proxy failed';
                this.readyState = 4;
                this._emit('readystatechange');
                this._emit('error');
                this._emit('loadend');
            }

            _emit(type) {
                const event = new Event(type);
                this.dispatchEvent(event);
                const handler = this[`on${type}`];
                if (typeof handler === 'function') {
                    try {
                        handler.call(this, event);
                    } catch (_) { }
                }
            }
        }

        ProxyXMLHttpRequest.UNSENT = 0;
        ProxyXMLHttpRequest.OPENED = 1;
        ProxyXMLHttpRequest.HEADERS_RECEIVED = 2;
        ProxyXMLHttpRequest.LOADING = 3;
        ProxyXMLHttpRequest.DONE = 4;
        window.XMLHttpRequest = ProxyXMLHttpRequest;

        window.addEventListener('message', async (event) => {
            // Ensure the message is from the direct parent and is of type 'execute'
            if (event.source === window.parent && event.data.type === 'execute') {
                const executionId = event.data.executionId; // Get execution ID
                // Initialize results array with pre-calculated MCP results, if provided
                const results = event.data.initialMcpResults ? [...event.data.initialMcpResults] : [];
                // Expose the user's tool registry to generated code via rtrvr.listTools()
                if (Array.isArray(event.data.availableTools)) {
                    window.__rtrvrAvailableTools = event.data.availableTools;
                }

                // Execute sandboxed functions (event.data.functions)
                for (const { functionCallArgs, code, executionContext } of event.data.functions) {
                    let consoleOutput = '';
                    let error = null;
                    let finalResult = null;
                    const consoleMethods = ['log', 'info', 'warn', 'error'];
                    const originalConsole = {};
                    const previousExecutionContext = window.__rtrvrCurrentExecutionContext;

                    try {
                        window.__rtrvrCurrentExecutionContext = executionContext || null;
                        consoleMethods.forEach(method => {
                            originalConsole[method] = console[method];
                            console[method] = (...args) => {
                                try {
                                    consoleOutput += `[${method}] ` + args.map(arg =>
                                        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                                    ).join(' ') + '\n';
                                } catch (stringifyError) {
                                    consoleOutput += `[${method}] Error stringifying console arguments.\n`;
                                }
                                originalConsole[method].apply(console, args);
                            };
                        });
                        finalResult = await evaluateSandboxCode(code);
                    } catch (e) {
                        error = {
                            name: e.name || 'ExecutionError',
                            message: e.message || 'An error occurred in sandboxed code.',
                            stack: e.stack,
                        };
                    } finally {
                        window.__rtrvrCurrentExecutionContext = previousExecutionContext || null;
                        consoleMethods.forEach(method => {
                            console[method] = originalConsole[method];
                        });
                        // *** CHANGE IS HERE: Convert the result to ToolOutput before pushing ***
                        const toolOutputResult = toToolOutput(finalResult);
                        results.push({
                            functionCallArgs: functionCallArgs,
                            result: toolOutputResult,
                            consoleOutput: consoleOutput,
                            error: error,
                        });
                    }
                }
                // Post all results (MCP + Sandboxed) back
                if (event.source && event.source.postMessage) {
                    event.source.postMessage({
                        type: 'results',
                        executionId: executionId, // Include execution ID
                        results: results,
                    }, '*');
                }
            }
        });
    </script>
</head>
