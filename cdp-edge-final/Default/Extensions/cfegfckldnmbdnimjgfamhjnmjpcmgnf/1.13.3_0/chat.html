<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Context Flow</title>
  <link rel="stylesheet" href="/fonts/lexend.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
        color: #E3E4E4;
      }
    }

    .container {
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: white;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .logo img {
      width: 50px;
      height: 50px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 1.125rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .loading {
      margin-top: 2rem;
      opacity: 0.8;
    }

    .loading-dots {
      display: inline-flex;
      gap: 0.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }
  </style>
  <script type="module" crossorigin src="/modulepreload-polyfill.js"></script>
  <script type="module" crossorigin src="/content.js"></script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="icons/icon128.png" alt="Plurality">
    </div>
    <h1>AI Context Flow</h1>
    <p style="font-size: 0.875rem; opacity: 0.7;">by Plurality</p>
    <p style="margin-top: 1rem;">Your AI assistant is loading...</p>
    <div class="loading">
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>
