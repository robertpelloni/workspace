<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="js/jquery-3.4.1.min.js"></script>
  <style>
    body {overflow-x: hidden; min-width: 300px;font-family:"Open Sans",Helvetica,Arial,sans-serif;}
    a {text-decoration: none;}
    input:focus::-webkit-input-placeholder { color:transparent; }
    input:focus::-moz-placeholder { color:transparent; } 
    input:focus::input-placeholder { color:transparent; }
    a[target="_blank"]::after {content: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAQElEQVR42qXKwQkAIAxDUUdxtO6/RBQkQZvSi8I/pL4BoGw/XPkh4XigPmsUgh0626AjRsgxHTkUThsG2T/sIlzdTsp52kSS1wAAAABJRU5ErkJggg==); margin: 0 3px 0 5px;

  <title>User-Agent Switcher</title>
</head>
<body>
  <p style="color: blue; font-weight: bold;">Select User-Agent:</p>
    <p>
      <select id="ua">
        <option value="default">Default (Edge)</option>
        <option value="custom">My Custom User-Agent</option>  
        <option value="chrome">Google Chrome</option>
        <option value="firefox">Firefox on Windows 10</option>
        <option value="android">Chrome on Android</option>
        <option value="iphone">Safari on iPhone</option>
        <option value="ipad">Safari on iPadOS/macOS</option>
        <option value="cros">Chrome on Chromebook/ChromeOS</option>
        <option value="rpi4">Chromium on Raspberry Pi 4</option>
        <option value="ie6">Internet Explorer 6</option>
        <option value="fuchsia">Chrome on Fuchsia OS</option>
        <option value="kindle">Amazon Kindle's Browser</option>
        <option value="phonebot">Googlebot smartphone</option>
        <option value="bot">Googlebot (Classic)</option>
          
      </select>
      &nbsp; <span id="status" style="color: red;"></status>
      </p>
      <p>&nbsp;</p>
      <p style="color: blue; font-weight: bold;">Enter Your Custom User-Agent String:</p>
      <input name="customua" id="customua" type="text" size="50" placeholder=" Enter your custom user-agent"/><br/>
      <button id="save" style="margin-top: 20px;">Save</button> &nbsp; <span id="status2" style="color: gray;">Select Custom User-Agent from above drop-down menu.</span>
      <p>&nbsp;</p>
      <p><a id="check" style="color: blue; font-weight: bold;" href="https://tools.browsernative.com/" target="_blank">Verify User-Agent Setting</a></p>
      <p><a style="color: blue; font-weight: bold;" href="https://browsernative.com/user-agent-chrome-extension/" target="_blank">Extension by BrowserNative</a></p>
      <script src="js/popup.js"></script>
    </body>
    </html>
