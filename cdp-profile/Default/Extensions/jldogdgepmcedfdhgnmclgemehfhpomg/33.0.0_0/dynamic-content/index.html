<!DOCTYPE html>
<html>
<head>
    <title>rtrvr.ai Dynamic Content</title>
    <style>
        /* Make iframe fill the space */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars on the main sandbox page */
            background-color: transparent; /* Optional: Ensure no default background interferes */
        }
        iframe#render-frame {
            width: 100%;
            height: 100%;
            border: none; /* Remove default iframe border */
            display: block; /* Avoid potential extra space below */
        }
    </style>
    <script>
        const expectedOrigin = window.location.origin;
        if (!expectedOrigin) {
             console.error("Dynamic Content: Extension origin not found in URL!");
        }

        // Function to render HTML in the iframe
        function renderHtmlInFrame(htmlString) {
            let iframe = document.getElementById('render-frame');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'render-frame';
                // *** SECURITY: Apply sandbox attributes to the iframe ***
                // Allow scripts needed by the dynamic content (like Chart.js)
                // Disallow things like top-level navigation, modals, etc., unless specifically needed.
                iframe.sandbox = 'allow-scripts allow-same-origin'; // Allow scripts & treat content as same-origin *relative to itself* for things like Chart.js CDN loading. BE CAREFUL if the HTML could be malicious. 'allow-forms' might be needed too.
                document.body.appendChild(iframe);
            }
            // Set the iframe content using srcdoc
            iframe.srcdoc = htmlString;
            // Remove the placeholder explicitly if it existed
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.remove();
            }
        }

        window.addEventListener('message', (event) => {
            if (!expectedOrigin) {
                console.warn("Dynamic Content: Cannot verify message origin, expected origin is missing.");
                return;
            }
            if (event.origin !== expectedOrigin) {
                console.warn(`Dynamic Content: Message received from unexpected origin: ${event.origin}. Expected: ${expectedOrigin}. IGNORING.`);
                return;
            }

            // --- Handle different message types ---
            if (event.data) {
                switch (event.data.type) {
                    case 'renderHtml':
                        if (typeof event.data.htmlString === 'string') {
                            renderHtmlInFrame(event.data.htmlString);
                        } else {
                            console.error('Dynamic Content: renderHtml message received, but htmlString is missing or not a string.');
                        }
                        break;
                    default:
                        console.warn('Dynamic Content: Received message with unknown type:', event.data.type);
                }
            }
        });

    </script>
</head>
<body>
    <!-- Content will be replaced or an iframe will be added here by the script -->
    <!-- It's often best to start body empty or with a loading indicator -->
</body>
</html>
